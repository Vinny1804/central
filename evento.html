<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Divisão de gastos</title>
<script src="config.js"></script>
<script>window.CENTRAL_PUB={tipo:"evento",c:(new URLSearchParams(location.search).get("c")||"")};</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna de celular (máx. 480px) com barra inferior fixa; telas trocam no lugar, formulários sobem de baixo */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --ink:#1a2030; --muted:#5f6878; --line:#dfe2e9;
  --accent:#3347c9; --accent-ink:#ffffff; --accent-soft:#e6e9fb;
  --warm:#d9792a; --warm-soft:#fbeedf;
  --ok:#1d8048; --ok-soft:#e0f2e7; --bad:#b9461b; --bad-soft:#f8e6de; --wait:#8a6a14; --wait-soft:#f6efd8;
  --wa:#1a8f4e;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --shadow:0 10px 30px rgba(20,25,45,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#1a1e27; --sunk:#151921; --ink:#e7eaf1; --muted:#9aa2b2; --line:#2a303c;
  --accent:#8e9cff; --accent-ink:#11141b; --accent-soft:#252b4a;
  --warm:#f0a35a; --warm-soft:#3a2b1c;
  --ok:#5fc98a; --ok-soft:#1b3326; --bad:#f08a64; --bad-soft:#3a231b; --wait:#e0c169; --wait-soft:#332c17;
  --wa:#4fcf86; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1e27; --sunk:#151921; --ink:#e7eaf1; --muted:#9aa2b2; --line:#2a303c;
  --accent:#8e9cff; --accent-ink:#11141b; --accent-soft:#252b4a;
  --warm:#f0a35a; --warm-soft:#3a2b1c;
  --ok:#5fc98a; --ok-soft:#1b3326; --bad:#f08a64; --bad-soft:#3a231b; --wait:#e0c169; --wait-soft:#332c17;
  --wa:#4fcf86; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.preview-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--wait);background:var(--wait-soft);border-radius:10px;padding:8px 10px;margin-top:12px}
.preview-bar button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;padding:0;font-size:12.5px;white-space:nowrap}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.month-head h2{text-transform:capitalize}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:4px 0}
.day{position:relative;border:0;background:none;aspect-ratio:1;max-width:100%;border-radius:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day.out{color:var(--muted);opacity:.45}
.day.today{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--warm)}
.day.sel .dots i{box-shadow:0 0 0 1px var(--accent-ink)}

.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.ev .date{display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);padding-right:10px}
.ev .date b{font-family:var(--f-display);font-size:22px;line-height:1}
.ev .date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ev .info{min-width:0}
.ev .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{font-weight:700}
.ev .chev{color:var(--muted);font-size:20px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.tag.warm{background:var(--warm-soft);color:var(--warm)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:14px}

.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:var(--shadow);z-index:20}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:10px 0 12px;font-size:11.5px;min-width:0;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}

/* Evento */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:700;padding:16px 0 6px}
.ev-head{padding:4px 0 14px}
.ev-head .when{font-weight:600;margin-top:6px}
.meta{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px}
.meta div{display:flex;gap:8px}
.meta svg{flex:none;width:18px;height:18px;color:var(--muted);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;border:0}
.pill.vou{background:var(--ok-soft);color:var(--ok)}
.pill.nao{background:var(--bad-soft);color:var(--bad)}
.pill.sem{background:var(--wait-soft);color:var(--wait)}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.link-box{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:8px}
.link-box .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link-box code{display:block;font-size:12.5px;word-break:break-all;color:var(--muted);margin:4px 0 8px;user-select:all}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 10px;margin-top:10px}
.sync.off{color:var(--muted);background:var(--sunk)}

/* Divisão */
.split-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.split-sum div{background:var(--sunk);border-radius:12px;padding:8px 10px}
.split-sum span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.split-sum b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.bal{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal.pos{color:var(--ok)}
.bal.neg{color:var(--bad)}
.items{font-size:12.5px;color:var(--muted)}
.part{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.part:hover{background:var(--sunk)}
.tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.tr.done{background:var(--ok-soft);border-color:transparent}
.tr.done .amt{color:var(--ok)}
.paid{display:inline-flex;align-items:center;gap:7px;color:var(--ok);font-weight:700;font-size:13.5px;margin-top:6px}
.paid i{width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 4px}
.quem{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.quem label{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.quem select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-weight:600}
.rp{border-radius:12px;padding:10px 12px;background:var(--sunk);font-weight:700;margin-bottom:4px}
.rp.pos{background:var(--ok-soft);color:var(--ok)}
.rp.neg{background:var(--bad-soft);color:var(--bad)}
.rp span{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.fold{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.fold summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:700;font-family:var(--f-display);font-size:15px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font-size:20px;color:var(--muted);font-family:var(--f-body)}
.fold[open] summary::after{content:"–"}
.fold[open]{padding-bottom:12px}
.open-ev{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px}
.open-ev .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.open-ev .t{font-weight:700;display:inline-flex;align-items:center;gap:8px}
.open-ev .t svg{width:20px;height:20px;color:var(--accent)}
.open-ev code{display:block;font-size:12px;color:var(--muted);word-break:break-all;margin-top:6px}
.cfg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 2px}
.cfg:first-of-type{border-top:0}
.cfg .grow{flex:1;min-width:0}
.cfg svg{width:22px;height:22px;color:var(--muted);flex:none}
.prog{font-size:12.5px;color:var(--muted);font-weight:600}
.tr .line1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tr .who{font-weight:600}
.tr .amt{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pixopt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:10px;padding:7px 8px 7px 10px;margin-top:6px}
.pixopt span{min-width:0;word-break:break-all;font-size:13px}
.pixopt b{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.pix-row{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;align-items:center;margin-bottom:6px}
.pix-row select,.pix-row input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 8px;min-width:0;width:100%}
.tr .pix{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.split-off{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Folha (formulários) */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{background:var(--sunk);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.guest-edit{display:flex;gap:8px;align-items:center;padding:6px 0}
.guest-edit .grow{flex:1;min-width:0;font-weight:600}
.x{border:0;background:var(--sunk);width:28px;height:28px;border-radius:8px;color:var(--muted)}

/* Sub-abas */
.vg-menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:4px;margin:6px 0 8px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 6px 16px -10px rgba(20,24,40,.35)}
.vg-menu button{position:relative;border:0;background:none;border-radius:14px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);min-width:0;transition:background .15s,color .15s,border-color .15s}
@keyframes vgflash{0%{box-shadow:0 0 0 3px var(--accent);border-radius:18px}100%{box-shadow:0 0 0 3px transparent;border-radius:18px}}
.vg-sec.vg-flash{animation:vgflash 1.2s ease-out}
.vg-menu button span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vg-menu svg{width:21px;height:21px}
.vg-menu button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(51,71,201,.25)}
.vg-menu .bd{position:absolute;top:-6px;right:2px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.vg-menu button{transition:none}}
.vg-sec{scroll-margin-top:64px;padding-top:6px}
.vg-sec>h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.vg-sec>h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.day.inr{background:var(--accent-soft)}
.day.inr.sel{background:var(--accent)}
.mtitle{border:0;background:none;padding:6px 10px;border-radius:10px;font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:capitalize;color:var(--ink)}
.mtitle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.mh-right{display:flex;gap:6px;align-items:center}
.today-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;font-weight:700;font-size:13px;color:var(--accent)}
.cal-bar{display:flex;justify-content:center;margin-top:10px}
.lemb{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--warm-soft);color:var(--warm);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;margin:0 0 10px}
.lemb i{width:7px;height:7px;border-radius:50%;background:var(--warm)}
.gtag{font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.ev.gev{background:var(--bg);border-style:dashed}
.gcal{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.gcal:first-of-type{border-top:0}
.gcal input{width:18px;height:18px;accent-color:var(--accent)}
.gcal .sw{width:12px;height:12px;border-radius:3px;flex:none}
.gcal .grow{flex:1;min-width:0}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:10px 12px 9px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.subtabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.lanc-seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:-4px 0 14px;gap:2px}
.lanc-seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.lanc-seg button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.desp-add{margin:0 0 12px;padding:13px;font-size:16px}
.pref.big input{font-size:26px;font-weight:700;padding:12px 12px 12px 4px}
.pref.big span{font-size:18px}
.fold.mais{margin:2px 0 6px}
.pan-tab{padding:6px 14px}
.pt-h,.pt-r,.pt-f{display:grid;grid-template-columns:1fr 54px 92px;gap:8px;align-items:center}
.pt-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.pt-h span:last-child,.pt-r b,.pt-f b{text-align:right}
.pt-r{width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.pt-n{display:flex;flex-direction:column;min-width:0;font-weight:600}
.pt-n small{font-size:11px;font-weight:700;background:none!important;padding:0}
.pt-n small{color:var(--muted)}.pt-n small.al-warm{color:var(--warm)}.pt-n small.al-bad{color:var(--bad)}
.pt-d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pt-f{padding:9px 0 4px;font-weight:700;grid-template-columns:1fr auto}
.pan-pl{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:inherit}
.star{font-size:20px;line-height:1;color:var(--muted)}
.star.on,.icon-btn.star.on{color:#f5a623}
.icon-btn.star{font-size:20px}.icon-btn.star.on{border-color:#f5a623;background:rgba(245,166,35,.12)}
.pl-btns .star{margin-left:auto}
.sec-fold{margin:0 0 4px}
.sec-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:18px 0 10px}
.sec-fold>summary::-webkit-details-marker{display:none}
.sec-fold>summary h2{margin:0;font-size:18px}
.sec-fold>summary .sf-n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.sec-fold>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sec-fold[open]>summary::after{transform:rotate(-135deg)}
.fc-star{border:0;background:none;padding:0 4px 0 2px;align-self:center;min-width:36px;min-height:44px}
.fat-sec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.fat-sec .fh-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pan-fat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);color:inherit}
.pan-fat .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.ben-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ben-row>div{display:flex;flex-direction:column;gap:2px}
.ben-row>b{font-family:var(--f-display);font-size:19px}
.sob-chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end;height:150px}
.sc-col{display:flex;flex-direction:column;align-items:center;height:100%;border:0;background:none;padding:2px 0;border-radius:8px;color:inherit;min-width:0}
.sc-col.on{background:var(--accent-soft)}
.sc-col:disabled{opacity:.45}
.sc-v{font-size:9.5px;font-weight:700;color:var(--ok);white-space:nowrap;height:14px;font-variant-numeric:tabular-nums}
.sc-v.neg{color:var(--bad)}
.sc-a{flex:1;width:62%;display:flex;align-items:flex-end}
.sc-a i{display:block;width:100%;border-radius:4px 4px 2px 2px}
.sc-a i.pos{background:var(--ok)}
.sc-a i.neg{background:var(--bad)}
.sc-l{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px}
.sc-col.on .sc-l{color:var(--accent)}
.sc-res{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.sc-res>span{color:var(--muted)}
.sc-res>span b{color:var(--ink)}
.sc-ano{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-weight:600}
.sc-ano b{font-family:var(--f-display);font-size:17px}
.cm-pi{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.cm-pi .fh-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cm-pi-c{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cm-pi-c .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.cm-pi-c .tag{align-self:flex-start}
.toast.undo{display:flex;align-items:center;gap:14px;pointer-events:auto}
.toast.undo button{border:0;background:none;color:#9db0ff;font-weight:800;padding:4px 2px;font-size:14px}
.fm-mais{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:24px;font-weight:600;line-height:1;box-shadow:0 4px 12px rgba(51,71,201,.25)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.duo-c{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;color:inherit;min-width:0}
.duo-c b{font-family:var(--f-display);font-size:19px}
.duo-c b small{font-size:12px;font-weight:600;color:var(--muted)}
.pv-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.pv-top>div{display:flex;flex-direction:column;gap:2px}
.pv-top b{font-family:var(--f-display);font-size:21px}
.pv-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pv-l span{display:flex;flex-direction:column;font-weight:600}
.pv-l small{font-weight:500;font-size:12px;color:var(--muted)}
.lim-al{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.lim-r{border:1px solid var(--warm-soft);background:var(--surface);border-radius:12px;padding:8px 12px}
.lim-r.bad{border-color:var(--bad);background:var(--bad-soft)}
.lim-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px;font-size:14px}
.lim-r.bad .lim-t b{color:var(--bad)}
.lanc-op{display:grid;gap:8px;margin-bottom:8px}
.lanc-op button{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;color:inherit}
.lanc-op b{font-size:17px}
.lanc-op span{font-size:13px;color:var(--muted)}
.cfg-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.em-prev{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px;display:flex;flex-direction:column;gap:4px}
.em-prev p{margin:0;font-size:14px}
.lim-in{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;margin-bottom:8px}
.lim-in label{margin:0}
.vg-volta{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px 6px 8px;margin:10px 0 0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 0}

/* Abas Hoje, Tarefas, Anotações, Wishlist */
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{white-space:nowrap;flex:none}
.chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.tiles{display:grid;gap:8px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.t4 .tile b{font-size:20px}
.tile span{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.vg-tiles{margin:0 0 14px}
.vg-tiles .tile{text-align:center;align-items:center;padding:10px 4px}
.tile.wt b{color:var(--wait)}
.tile.bad b{color:var(--bad)} .tile.acc b{color:var(--accent)} .tile.ok b{color:var(--ok)} .tile.zero b{color:var(--muted)}
.tile.bad{border-color:var(--bad-soft);background:linear-gradient(var(--bad-soft),var(--bad-soft)) top/100% 3px no-repeat,var(--surface)}
.tile.zero.bad{border-color:var(--line)}
.tk{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tk-check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;color:var(--surface);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px;padding:0}
.tk-check.on{background:var(--ok);border-color:var(--ok)}
.tk-body{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;color:inherit}
.tk-t{font-weight:700}
.tk.done .tk-t{text-decoration:line-through;color:var(--muted)}
.tag.al-bad,.tag.pr-u{background:var(--bad-soft);color:var(--bad)}
.tag.al-warm,.tag.pr-a{background:var(--warm-soft);color:var(--warm)}
.tag.al-acc,.tag.pr-m{background:var(--accent-soft);color:var(--accent)}
.tag.al-muted,.tag.pr-b{background:var(--sunk);color:var(--muted)}
.nt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit}
.nt .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nt .tt{font-weight:700;margin-top:6px}
.nt p{margin:4px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.wi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.wi .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wi .price{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wi.off .tk-t{text-decoration:line-through;color:var(--muted)}
.sumcard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sumcard>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sumcard span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.sumcard b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.day-h{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.panel>.day-h:first-child{margin-top:0}
.mini{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.day-h+.mini{border-top:0}
.mini .grow{flex:1;min-width:0}
.mini .k{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ck-row{display:grid;grid-template-columns:24px 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.cat-row{display:grid;grid-template-columns:1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.ck-row input[type=text],.cat-row input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.ck-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.lock-screen{text-align:center;padding:50px 10px}
.lock-screen .ic{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.lock-screen .ic svg{width:30px;height:30px}
.hello{align-items:flex-start}
.hello .d{color:var(--muted);font-weight:600;font-size:14px}

/* Formulário estilo Google Agenda */
.app.wide{max-width:1040px}
.gbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.gtitle{border:0;border-bottom:1.5px solid var(--line);background:none;font-family:var(--f-display);font-size:24px;font-weight:600;padding:6px 2px;min-width:0;width:100%;border-radius:0}
.gtitle:focus{outline:none;border-bottom-color:var(--accent)}
.pillbtn{border-radius:999px;padding:9px 22px}
.gwhen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.gwhen input,.gwhen select,.grow-in input,.grow-in select,.grow-in textarea{border:0;background:var(--sunk);border-radius:8px;padding:10px 12px;min-width:0}
.gwhen .ate{color:var(--muted)}
[hidden]{display:none!important}
.gcheck{display:inline-flex;align-items:center;gap:8px;font-weight:500;padding:6px 4px}
.gcheck input{width:18px;height:18px;accent-color:var(--accent)}
.gcols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media (min-width:820px){.gcols{grid-template-columns:minmax(0,1fr) 340px}}
.gpanel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px 14px}
.gtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.gtabs span{padding:12px 2px 10px;font-weight:700;color:var(--accent);border-bottom:2.5px solid var(--accent)}
.grow-in{display:grid;grid-template-columns:24px 1fr;gap:14px;align-items:start;margin-bottom:12px}
.grow-in>svg{width:22px;height:22px;color:var(--muted);margin-top:9px}
.grow-in .stack{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.grow-in textarea{width:100%;min-height:110px;resize:vertical}
.grow-in input[type=text]{width:100%}
.cores{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--sunk);border-radius:8px;padding:6px 10px}
.cor{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.cor[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--sunk)}
.gsearch{width:100%;border:0;background:var(--sunk);border-radius:8px;padding:11px 12px}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.sel-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 6px 4px 10px;font-weight:600;font-size:13px;border:0}
.sel-chip b{font-weight:800}
.ct{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.ct:first-child{border-top:0}
.ct input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ct .grow{flex:1;min-width:0}
.ctlist{max-height:300px;overflow:auto;margin-top:6px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.guests-view{display:flex;flex-wrap:wrap;gap:6px}
.gv{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600}
.gv .avatar{width:24px;height:24px;font-size:10.5px}
.evdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Página do convidado */
.browser{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.urlbar{display:flex;align-items:center;gap:8px;background:var(--sunk);padding:8px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.urlbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest{padding:18px 16px 20px}
.guest .hero{background:var(--warm-soft);border-radius:14px;padding:16px}
.guest .hero .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.guest .hero h1{font-size:26px;margin-top:4px}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rsvp .btn{padding:12px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
.fm-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px;margin:0 0 12px}
.fm-bar b{font-family:var(--f-display);font-size:17px}
.fm-bar .icon-btn:disabled{opacity:.3}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0 4px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-dots i.err{border-color:var(--bad)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pinpad button{height:60px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--text)}
.pinpad button:active{background:var(--sunk)}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px}
.chart .col{display:flex;flex-direction:column;align-items:center;height:100%;background:none;border:0;padding:0;border-radius:8px;gap:4px}
.chart .col.on{background:var(--sunk)}
.chart .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-top:6px}
.chart .bars i{display:block;width:38%;max-width:9px;border-radius:3px 3px 0 0;min-height:2px}
.chart .bars i.r{background:var(--accent)}
.chart .bars i.d{background:var(--warm)}
.chart .lb{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:3px}
.chart .col.on .lb{color:var(--text)}
.hb{margin:10px 0}
.hb:first-child{margin-top:0}
.hb-l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hb-t{height:8px;border-radius:999px;background:var(--sunk);margin:5px 0 3px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--warm);border-radius:999px}
.fin-hero .fh-top,.li-hero .fh-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.fh-v{display:block;font-family:var(--f-display);font-size:34px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.fh-v.ok{color:var(--ok)}
.fin-hero{margin-bottom:4px}
.fc-l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk.paid-c{background:var(--ok-soft);border-color:transparent}
.sumcard small{display:block;font-size:11.5px;margin-top:1px}
.li-hero .btn.wa{width:100%;justify-content:center;margin-top:12px}
.li-add{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:12px 0 4px}
.li-add input,.li-add select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0;color:var(--text)}
.li-add select{max-width:118px;font-size:13px}
.li-add .btn{padding:0 16px;font-size:20px}
.tk.li{align-items:center;padding:8px 12px}
.tk.li .tk-body{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tk.li.done{opacity:.7}
.cm-seg{display:flex;margin:0 0 12px}
.cm-seg button{flex:1;padding:9px 14px;font-size:14px}
.li-hero .btn.wa{display:flex}

/* ---------- cálculo da divisão ---------- */
function calc(div){
  var ps = div.participantes;
  var total=0, cotas=0;
  ps.forEach(function(p){ p._gasto = p.gastos.reduce(function(a,g){return a+g.valor;},0); total+=p._gasto; cotas+=p.pessoas; });
  var porPessoa = cotas? total/cotas : 0;
  var bal = ps.map(function(p){ return {p:p, v: Math.round((p._gasto - porPessoa*p.pessoas)*100)}; });
  // ajusta arredondamento para fechar em zero
  var soma = bal.reduce(function(a,b){return a+b.v;},0);
  if(soma!==0 && bal.length){ bal.sort(function(a,b){return a.v-b.v;}); bal[0].v -= soma; }
  // pagamentos já feitos (com valor) abatem do saldo; o "quem paga a quem" mostra só o que falta
  var feitos=[], byId={}, resta={}; ps.forEach(function(p){ byId[p.id]=p; });
  var bal2=bal.map(function(b){ return {p:b.p,v:b.v}; }), ix={}; bal2.forEach(function(b){ ix[b.p.id]=b; });
  Object.keys(div.pagos||{}).forEach(function(k){ var v=+div.pagos[k]; if(!(v>0)) return; var pr=k.split(">"), de=byId[pr[0]], pa=byId[pr[1]]; if(!de||!pa) return;
    feitos.push({de:de,para:pa,valor:v,k:k}); ix[de.id].v+=Math.round(v*100); ix[pa.id].v-=Math.round(v*100); });
  bal2.forEach(function(b){ resta[b.p.id]=b.v/100; });
  var dev = bal2.filter(function(b){return b.v<0;}).map(function(b){return {p:b.p,v:-b.v};});
  var cre = bal2.filter(function(b){return b.v>0;}).map(function(b){return {p:b.p,v:b.v};});
  var tr=[];
  while(dev.length && cre.length){
    dev.sort(function(a,b){return b.v-a.v;}); cre.sort(function(a,b){return b.v-a.v;});
    var d=dev[0], c=cre[0], m=Math.min(d.v,c.v);
    tr.push({de:d.p, para:c.p, valor:m/100});
    d.v-=m; c.v-=m;
    if(d.v===0) dev.shift(); if(c.v===0) cre.shift();
  }
  var saldo={}; bal.forEach(function(b){ saldo[b.p.id]=b.v/100; });
  return {total:total, cotas:cotas, porPessoa:porPessoa, tr:tr, saldo:saldo, feitos:feitos, resta:resta};
}

var FILTROS=[["abertas","Abertas"],["urgentes","Urgentes"],["atrasadas","Atrasadas"],["lembrete","Lembrete hoje"],["andamento","Em andamento"],["pendentes","Pendentes"],["concluidas","Concluídas"],["todas","Todas"]];
function passaFiltro(t,f){ return f==="todas"||(f==="abertas"&&aberta(t))||(f==="urgentes"&&aberta(t)&&t.prioridade==="Urgente")||(f==="atrasadas"&&alerta(t)==="Atrasada")||(f==="lembrete"&&alerta(t)==="Lembrete hoje")||(f==="andamento"&&t.status==="Em andamento")||(f==="pendentes"&&t.status==="Pendente")||(f==="concluidas"&&t.status==="Concluído"); }
var AL_ORD={"Atrasada":0,"Vence hoje":1,"Lembrete hoje":2,"No prazo":3,"":4};
function ordemTarefa(a,b){ return (AL_ORD[alerta(a)]-AL_ORD[alerta(b)]) || (PRIOR.indexOf(a.prioridade)-PRIOR.indexOf(b.prioridade)) || ((a.prazo||"9999")<(b.prazo||"9999")?-1:(a.prazo||"9999")>(b.prazo||"9999")?1:0); }
function cardTarefa(t){
  var al=alerta(t), feito=t.status==="Concluído", canc=t.status==="Cancelado";
  var ck=t.checklist.length? t.checklist.filter(function(x){return x.ok;}).length+"/"+t.checklist.length : "";
  return '<div class="tk'+(feito||canc?' done':'')+'"><button class="tk-check'+(feito?' on':'')+'" data-a2="tk-toggle" data-id="'+t.id+'" aria-label="'+(feito?'Reabrir':'Concluir')+': '+esc(t.titulo)+'">'+(feito?'✓':'')+'</button>'+
    '<button class="tk-body" data-a2="tk-edit" data-id="'+t.id+'"><div class="tk-t">'+esc(t.titulo)+'</div><div class="tags">'+
    '<span class="tag '+PR_CLS[t.prioridade]+'">'+t.prioridade+'</span>'+
    (al && (al!=="No prazo"||t.prazo)?'<span class="tag '+AL_CLS[al]+'">'+al+'</span>':'')+
    (t.status==="Em andamento"?'<span class="tag acc">Em andamento</span>':'')+(canc?'<span class="tag">Cancelada</span>':'')+
    '<span class="tag">'+esc(t.categoria)+'</span>'+
    (t.prazo?'<span class="tag">Prazo '+quando(t.prazo)+'</span>':'')+
    (t.lembrete&&aberta(t)&&t.lembrete>HOJE?'<span class="tag">Lembrete '+quando(t.lembrete)+'</span>':'')+
    (ck?'<span class="tag">Checklist '+ck+'</span>':'')+'</div></button></div>';
}
function listaTarefas(){
  var f=ui.tf||"abertas", q=(ui.tq||"").trim().toLowerCase(), cat=ui.tc||"";

    var v=valorConta(c,k); if(v===null){ var m=media3(function(kk){ var x=valorConta(c,kk); return x===null||x===0?null:x; },k); varia+=m||0; } else if(c.modo==="variavel") varia+=v; else fixas+=v; });

function aplicarNaDivisao(l){
  if(!l.ev||!l.resp) return "";
  var e=ev(l.ev); if(!e||!e.divisao) return "";
  e.divisao.participantes.forEach(function(p){ p.gastos=p.gastos.filter(function(g){return g.lista!==l.id;}); });
  var p=e.divisao.participantes.find(function(x){return x.cid===l.resp;});
  if(!p){ var c=S.contatos.find(function(x){return x.id===l.resp;}); p={id:uid(),cid:c.id,nome:c.nome,pessoas:c.pessoas||1,pix:c.pix||"",gastos:[]}; e.divisao.participantes.push(p); e.divisao.fora=(e.divisao.fora||[]).filter(function(x){return x!==c.id;}); }
  p.gastos.push({desc:"Lista: "+l.nome,valor:l.total,lista:l.id});
  return e.titulo;
}

function seedMes(){
  var lojas=["Mercado do bairro","Atacado","Feira"];
  var base=[["Arroz","5 kg","Mercearia",24.9,1,"fora",1],["Feijão","1 kg","Mercearia",7.9,1,"fora",2],["Café","500 g","Mercearia",18,0,"ok",2],["Açúcar","1 kg","Mercearia",4.6,1,"",1],["Óleo","900 ml","Mercearia",7.6,1,"fora",2],
    ["Leite","1 L","Bebidas",4.95,1,"",12],["Banana","dúzia","Hortifrúti",7.5,2,"ok",1],["Tomate","1 kg","Hortifrúti",8.9,2,"",1],["Frango","1 kg","Carnes e frios",13.9,0,"",2],
    ["Detergente","500 ml","Limpeza",2.4,1,"fora",3],["Sabão em pó","1 kg","Limpeza",21.9,1,"",1],["Papel higiênico","12 rolos","Higiene",19.9,1,"",1],["Pasta de dente","90 g","Higiene",4.9,0,"fora",2]];
  var cur=mesAtualIdx(), compras=[];
  // uma compra grande por mês nos 3 meses anteriores
  var datas=[[fmKey(cur-3)+"-06"],[fmKey(cur-2)+"-04",fmKey(cur-2)+"-19"],[fmKey(cur-1)+"-05"]];
  var itens=base.map(function(b){ return {id:uid(),nome:b[0],qtd:b[1],n:b[6]||1,sec:b[2],ok:b[5]==="ok",fora:b[5]==="fora",preco:b[3],loja:lojas[b[4]],hist:[]}; });
  datas.forEach(function(ds,j){ ds.forEach(function(dt,n){ var its=[];
    itens.forEach(function(it,x){ if(n===1&&x%3) return; if(n===0&&ds.length>1&&x%3===0) return; var p=Math.round(it.preco*[0.94,1.03,0.98][j]*10)/10, lj=lojas[(x+j)%3];
      it.hist.push({d:dt,p:p,n:it.n,l:lj}); its.push({nome:it.nome,qtd:it.qtd,sec:it.sec,preco:p,n:it.n,loja:lj}); });
    compras.push({id:uid(),data:dt,itens:its}); }); });
  // compra já feita neste mês: o que está "fora" foi comprado no dia 03
  var dt0=fmKey(cur)+"-03", its0=[];
  itens.forEach(function(it){ if(!it.fora) return; it.hist.push({d:dt0,p:it.preco,n:it.n,l:it.loja}); its0.push({nome:it.nome,qtd:it.qtd,sec:it.sec,preco:it.preco,n:it.n,loja:it.loja}); });
  compras.push({id:uid(),data:dt0,itens:its0});
  S.fechadas=compras;
  var l=listaPorId("mes"); if(l){ l.itens=itens; l.v4=true; l.v6=true; } else S.listas.unshift({id:"mes",mensal:true,v4:true,v6:true,nome:"Compras do mês",itens:itens});
}

  var l=listaPorId("mes"), f=ui.cmCat||"", q=(ui.cmQ||"").trim().toLowerCase(), h='';
  var vis=function(arr){ return arr.filter(function(i){return (!f||i.sec===f)&&(!q||i.nome.toLowerCase().indexOf(q)>=0);}); };
  var at=l.itens.filter(function(i){return !i.fora;});

function planoSaldo(p){ return (p.mov||[]).reduce(function(a,m){return a+m.valor;},0); }
function planoFonte(p){ if(!p.ref) return null; return p.ref.t==="wish"? S.wish.find(function(x){return x.id===p.ref.id;}) : S.notas.find(function(x){return x.id===p.ref.id;}); }
function syncPlanos(){
  if(!S.fin||!S.fin.planos) return;
  if(S.categorias.indexOf("Caixinha")<0) S.categorias.splice(Math.max(0,S.categorias.length-1),0,"Caixinha");
  var mudou=false;
  S.wish.forEach(function(w){ if(w.categoria!=="Caixinha") return; if(!S.fin.planos.some(function(p){return p.ref&&p.ref.t==="wish"&&p.ref.id===w.id;})){ S.fin.planos.push({id:uid(),tipo:"Compra",onde:"",mov:[],ref:{t:"wish",id:w.id}}); mudou=true; } });
  S.notas.forEach(function(n){ if(n.categoria!=="Caixinha") return; if(!S.fin.planos.some(function(p){return p.ref&&p.ref.t==="nota"&&p.ref.id===n.id;})){ S.fin.planos.push({id:uid(),tipo:"Guardar dinheiro",onde:"",mov:[],ref:{t:"nota",id:n.id}}); mudou=true; } });
  S.fin.planos=S.fin.planos.filter(function(p){ if(!p.ref) return true; var f=planoFonte(p);
    if(f&&f.categoria==="Caixinha"){ // mesmo item nos dois lugares
      if(p.ref.t==="wish"){ p.nome=f.item; p.meta=f.preco||0; p.prazo=f.meta||""; p.concluido=f.status==="Comprado"; p.desc=f.obs||""; }
      else { p.nome=f.titulo||"Sem título"; p.desc=f.texto||""; }
      return true; }
    mudou=true; if((p.mov||[]).length){ delete p.ref; return true; } return false; });
  if(mudou) save();
}

      pg.gastos.push({desc:document.getElementById("g-desc").value.trim()||"Gasto",valor:v2}); ui.fold=false; save(); render(); toast("Gasto lançado. A divisão já foi recalculada."); break; }
    case "resumo":
      if(!calc(e.divisao).tr.length){ toast("Ainda não há o que acertar"); return; }
      whats("Acerto de contas", textoResumo(e)); break;
  }
});
document.addEventListener("change",function(x){
  var tg=x.target;
  if(tg.id==="g-quem") ui.quem=tg.value;
  if(tg.id==="f-quem"){ ui.filtro=tg.value; render(); var q=document.getElementById("f-quem"); if(q) q.focus(); }
  if(tg.classList && tg.classList.contains("ct-g")) tg.parentNode.setAttribute("aria-pressed", tg.checked);
  if(tg.dataset && tg.dataset.tg && ui.draft){ var D=ui.draft, id=tg.dataset.tg; if(tg.checked){ if(D.convidados.indexOf(id)<0) D.convidados.push(id); } else D.convidados=D.convidados.filter(function(x){return x!==id;}); var sc=document.getElementById("gconv").querySelector(".sel-chips"); var tmp=document.createElement("div"); tmp.innerHTML=painelConvidados(); sc.replaceWith(tmp.querySelector(".sel-chips")); }
  if(tg.id==="f-di"){ lerForm(); render(); }
});
document.addEventListener("toggle",function(x){ if(x.target.id==="fold-gasto") ui.fold=x.target.open; },true);
document.addEventListener("input",function(x){ if(x.target.id==="f-busca" && ui.draft){ ui.draft.busca=x.target.value; document.getElementById("gconv").innerHTML=painelConvidados(); } });
document.addEventListener("keydown",function(x){ if(x.key==="Escape") close(); if(x.key==="Enter" && x.target.dataset && (x.target.dataset.editPart||x.target.dataset.ct||x.target.dataset.gr)) x.target.click(); });

if(!S.tarefas){ seedResto(S); save(); }
aplicarTema(); if(!PUB) render();
if(PUB){ document.getElementById("app").innerHTML='<div class="empty" style="margin-top:40px">Abrindo…</div>'; document.getElementById("nav").hidden=true; pubCarregar(true); setInterval(function(){ if(document.visibilityState==="visible") pubCarregar(false); },15000); }
else {
if(NOVO){ toast("Bem-vindo! Seus dados vão ficar salvos nesta planilha."); save(); }
carregarGoogle(); sincPub(); setInterval(function(){ if(document.visibilityState==="visible"&&!salvando) sincPub(); },30000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") sincPub(); });
}
})();
